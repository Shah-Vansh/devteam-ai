[project]
name = "devteam-backend"
version = "0.1.0"
description = "DevTeam AI backend: agents, workflow, MCP clients and API"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.6,<3",
    "openai>=3.0,<4",
    "mcp>=2.3,<3",
    "ruff>=0.8",
    "bandit>=1.8,<2",
    "e2b>=2.6,<3",
    "defusedxml>=0.7,<1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sse-starlette>=2,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agents" = ["prompts/*.md"]
"app.execution" = ["constraints.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
